name: frontend-ci-dev

on:
  push:
    branches:
      - dev
    paths:
      - "frontend/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4.2.2

      - name: Set image tag
        run: echo "IMAGE_TAG=dev-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./frontend/.
          push: true
          tags: 3omar0/-front:${{IMAGE_TAG}}




name: front-ci-prod
on:
  push:
    tag:
      - 'v*'
    paths:
      - "frontend/**"

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
    image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: checkout
        uses: actions/checkout@v4.2.2

      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./frontend/.
          push: true
          tags: 3omar0/mates-front:${{IMAGE_TAG}}


  deploy:
    needs: build
    runs-on: ubuntu-latest
  
    steps:
      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: omar-mn/mates-config
          token: ${{ secrets.GITOPS_TOKEN }}
  
      - name: Update image
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          sed -i "s/^  image:.*/  image: 3omar0/mates-front:${IMAGE_TAG}/" frontend.yaml
  
      - name: Commit and push
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update frontend image to ${IMAGE_TAG}"
          git push